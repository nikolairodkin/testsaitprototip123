# Автопубликация прототипа на GitHub Pages.
# Запускается при пуше в ветку с лендингом и вручную (кнопка Run workflow).
# Требование GitHub: бесплатный Pages доступен только для публичных репозиториев.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/finance-consulting-landing-mc47z6
    # правка документации не требует передеплоя
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; лишние запуски отменяются.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true — включает Pages в настройках репозитория автоматически
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Открываем опубликованный сайт как обычный посетитель — без авторизации.
      # Шаг падает, если страница или её файлы недоступны по публичной ссылке.
      - name: Check the site opens for anyone with the link
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          check() {
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/resp -w "%{http_code}" "$SITE_URL$1")
              if [ "$code" = "200" ] && { [ -z "$2" ] || grep -q -- "$2" /tmp/resp; }; then
                echo "OK  $SITE_URL$1 (HTTP $code)"; return 0
              fi
              echo "... $SITE_URL$1 -> HTTP $code, повтор через 10 с"; sleep 10
            done
            echo "FAIL $SITE_URL$1 недоступен без авторизации"; return 1
          }
          check ""                               'id="leadFormMain"'
          check ""                               'name="robots" content="noindex'
          check ""                               'property="og:image"'
          check "og-image.jpg"                   ''
          check "favicon.svg"                    '<svg'
          check "styles.css"                     '--c-accent'
          check "script.js"                      'const CONFIG'
          check "img/team/rodkina-galina.webp"   ''

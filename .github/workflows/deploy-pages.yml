# Автопубликация прототипа на GitHub Pages.
# Запускается при пуше в ветку с лендингом и вручную (кнопка Run workflow).
# Требование GitHub: бесплатный Pages доступен только для публичных репозиториев.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/finance-consulting-landing-mc47z6
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только один деплой; лишние запуски отменяются.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true — включает Pages в настройках репозитория автоматически
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
